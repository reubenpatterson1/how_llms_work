# Build Package — YAML DAG Format
# Generated by Architecture Agent → Decomposition Agent

metadata:
  phase: poc
  total_components: 4
  total_waves: 3
  max_parallelism: 2
  time_savings_percent: 25
  estimated_sequential_minutes: 80
  estimated_parallel_minutes: 60

spec:
  purpose:
    - "Objective: application type identified"
    - "Users: target audience identified (for developers)"
  data_model:
    - "Entity attributes specified (City (name NOT NULL, country_code))"
    - "Constraint: not null (NOT NULL)"
    - "Index strategy specified (Index on)"
  api:
    - "Endpoints: HTTP methods and routes defined (GET /api)"
    - "Realtime: WebSocket"
  tech_stack:
    - "Language: Python (Python 3.12)"
    - "Framework: Flask"
    - "Database: SQLite"
  auth:
    - "Auth: API key"
  deployment:
    - "Infrastructure: Docker containers"
    - "CI/CD: GitHub Actions"
  error_handling:
    - "Error taxonomy: multiple status codes mapped (400/401/404/500/502)"
    - "Retry: exponential backoff (Retry upstream OpenWeatherMap 3x exponential backoff)"
  performance:
    - "Latency targets specified (P95)"
  security:
    - "Input validation required (Input sanitiz)"
    - "CORS policy required"
    - "Rate limiting required"
  testing:
    - "Testing: framework specified (pytest)"
    - "Coverage target specified (70% coverage)"
    - "Test data: fixtures (Fixture)"

rules:
  - "Every architectural decision MUST trace to a constraint in spec"
  - "If a dimension has no constraint, ASK — do not invent"
  - "Prefer explicit over implicit in all generated code"
  - "No defaults: every value must come from this spec"

interfaces:
  IAuthService:
    owner: AuthService
    types:
      - AuthCredentials
      - AuthToken
      - TokenPayload
    methods:
      - "authenticate(credentials: AuthCredentials) -> AuthToken"
      - "validate_token(token: str) -> TokenPayload"
      - "authorize(user_id: str, permission: str) -> bool"

dag:
  database-config:
    name: DatabaseConfig
    type: config
    wave: 0
    complexity: low
    constraints:
      - "Database: SQLite"
    prompt: |
      Build a config component named `DatabaseConfig`.
      Purpose: Database connection and configuration.
      
      Constraints from the architecture spec:
      - Database: SQLite

  websocket-handler:
    name: WebSocketHandler
    type: handler
    wave: 1
    complexity: high
    constraints:
      - "Realtime: WebSocket"
    prompt: |
      Build a handler component named `WebSocketHandler`.
      Purpose: WebSocket real-time event handler.
      
      Constraints from the architecture spec:
      - Realtime: WebSocket

  api-handler:
    name: ApiHandler
    type: handler
    wave: 2
    complexity: medium
    consumes:
      - IAuthService
    constraints:
      - "Endpoints: HTTP methods and routes defined (GET /api)"
    prompt: |
      Build a handler component named `ApiHandler`.
      Purpose: REST endpoints for api resource.
      
      Constraints from the architecture spec:
      - Endpoints: HTTP methods and routes defined (GET /api)
      
      Depends on (import, do not implement): IAuthService

  api)-handler:
    name: Api)Handler
    type: handler
    wave: 2
    complexity: medium
    consumes:
      - IAuthService
    constraints:
      - "Endpoints: HTTP methods and routes defined (GET /api)"
    prompt: |
      Build a handler component named `Api)Handler`.
      Purpose: REST endpoints for api) resource.
      
      Constraints from the architecture spec:
      - Endpoints: HTTP methods and routes defined (GET /api)
      
      Depends on (import, do not implement): IAuthService

